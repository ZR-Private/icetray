[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# A panic must name its file and line; the DWARF variable information that
# full debug info adds is not needed to read one.
[profile.dev]
debug = "line-tables-only"

# The whole lint policy (RFD 015). Every crate opts in with
# `[lints] workspace = true`; the only allows outside this table are the two
# scoped carve-outs RFD 015 names.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

# arrow and parquet stay on the major iceberg depends on: the testkit hands
# iceberg's writer arrow batches, and one workspace must not compile two
# copies of arrow.
[workspace.dependencies]
icetray-core = { path = "crates/icetray-core" }
icetray-proto = { path = "crates/icetray-proto" }
icetray-testkit = { path = "crates/icetray-testkit" }

arc-swap = "1.9.2"
arrow = "58"
async-trait = "0.1.92"
aws-config = "1.12.0"
aws-credential-types = "1.3.0"
bytes = "1.12.1"
foyer = "0.22.6"
futures = "0.3.34"
http-body-util = "0.1.5"
# The testkit's in-process S3 server and simulation transport speak hyper 1
# directly: the server side serves s3s over a loopback or simulated
# connection, the client side is a hyper client behind object_store's
# transport trait, so the same object_store client runs over both.
hyper = { version = "1.11.1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "client-legacy", "http1", "server"] }
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
# Only the fixture writer needs a storage backend for the Iceberg library's
# own file I/O, and only S3: local files go through the library's built-in
# filesystem storage, and icetray itself reads every byte through object_store.
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-s3"] }
jiff = { version = "0.2.37", features = ["serde"] }
metrics = "0.24.6"
metrics-util = "0.20.4"
murmur3 = "0.5.2"
object_store = { version = "0.14.1", features = ["aws"] }
parquet = { version = "58", features = ["async"] }
pin-project-lite = "0.2.17"
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
rand = "0.10.2"
s3s = "0.16.1"
s3s-fs = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
toml = "1.1.6"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tracing = "0.1.44"
turmoil = "0.7.2"
url = "2.5.8"
uuid = "1.26.1"

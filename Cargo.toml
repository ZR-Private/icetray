[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"

# A panic must name its file and line; the DWARF variable information that
# full debug info adds is not needed to read one.
[profile.dev]
debug = "line-tables-only"

# Exists so profiles carry symbols: release code generation with full debug
# info and nothing stripped, so a profile of the benchmark program or the
# server names every function, inlined frames included. Build with
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# The whole lint policy (RFD 015). Every crate opts in with
# `[lints] workspace = true`; the only allows outside this table are the two
# scoped carve-outs RFD 015 names.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

# arrow and parquet stay on the major iceberg depends on: the testkit hands
# iceberg's writer arrow batches, and one workspace must not compile two
# copies of arrow.
[workspace.dependencies]
icetray-core = { path = "crates/icetray-core" }
icetray-proto = { path = "crates/icetray-proto" }
icetray-testkit = { path = "crates/icetray-testkit" }

arc-swap = "1.9.2"
arrow = "58"
async-trait = "0.1.92"
aws-config = "1.12.0"
aws-credential-types = "1.3.0"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32c = "0.6.8"
foyer = "0.22.6"
futures = "0.3.34"
http-body-util = "0.1.5"
# The testkit's in-process S3 server and simulation transport speak hyper 1
# directly: the server side serves s3s over a loopback or simulated
# connection, the client side is a hyper client behind object_store's
# transport trait, so the same object_store client runs over both.
hyper = { version = "1.11.1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "client-legacy", "http1", "server"] }
iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
# Only the fixture writer needs a storage backend for the Iceberg library's
# own file I/O, and only S3: local files go through the library's built-in
# filesystem storage, and icetray itself reads every byte through object_store.
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-s3"] }
jiff = { version = "0.2.37", features = ["serde"] }
libc = "0.2.189"
# The binary reads the process's resident set size for its memory gauge.
memory-stats = "1.2.0"
metrics = "0.24.6"
# The binary serves `/metrics` and `/ready` from one hyper listener of its
# own, so the exporter's own HTTP listener and push gateway stay out.
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
metrics-util = "0.20.4"
murmur3 = "0.5.2"
object_store = { version = "0.14.1", features = ["aws"] }
parquet = { version = "58", features = ["async"] }
pin-project-lite = "0.2.17"
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
rand = "0.10.2"
s3s = "0.16.1"
s3s-fs = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
# jemalloc for the binary alone: memory freed after a load (shed key chunks,
# dropped generations) returns to the operating system through its
# background purging, which the binary turns on at start.
tikv-jemalloc-ctl = "0.7.0"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
toml = "1.1.6"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tracing = "0.1.44"
# Logs are JSON events with a deployer's field names (RFD 012); the binary
# writes them through its own event formatter, so the subscriber's own
# formats and colors stay out.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "env-filter", "std"] }
turmoil = "0.7.2"
uuid = "1.26.1"

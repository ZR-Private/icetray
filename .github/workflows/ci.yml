name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag, so a moved
      # tag cannot re-point CI at different code. Renovate keeps the SHAs
      # current.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # rustup is preinstalled on the runner; `rustup show` installs the
      # toolchain named in rust-toolchain.toml, so CI and every developer
      # machine run the same compiler and the same clippy.
      - name: install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: fmt + clippy
        run: dev/ci-checks.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: cargo test
        run: cargo test --workspace --locked

  # RFD 012: the binary started the way an orchestrator starts it, every
  # element of the twelve-factor surface checked. One test of the workspace
  # run above, given a gate of its own so a broken surface is named.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - name: conformance run
        run: dev/conformance.sh

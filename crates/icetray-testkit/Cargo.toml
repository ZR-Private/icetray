[package]
name = "icetray-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-process S3, fixture writer, simulation, shared assertions, and the golden-table locator"

[lints]
workspace = true

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
base64.workspace = true
bytes = { workspace = true }
crc32fast = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
iceberg = { workspace = true }
iceberg-storage-opendal = { workspace = true }
icetray-core = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
pin-project-lite = { workspace = true }
roaring = { workspace = true }
s3s = { workspace = true }
s3s-fs = { workspace = true }
serde.workspace = true
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
# `net` for the in-process S3 server's loopback listener; nothing in the
# serving crates listens.
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true }
tracing = { workspace = true }
turmoil = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
clap.workspace = true
# The container-gated catalog test writes its fixture through a REST catalog.
iceberg-catalog-rest = { workspace = true }
icetray = { path = "../icetray" }
icetray-proto.workspace = true
libc.workspace = true
memory-stats.workspace = true
rand.workspace = true
tikv-jemallocator.workspace = true
tonic.workspace = true

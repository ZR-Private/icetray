// The client contract of icetray: read-only get-by-key lookups over Apache
// Iceberg tables, served over gRPC. Clients in any language are generated
// from this file; icetray ships no hand-written client. icetray emits JSON
// only as the output of the operator subcommands (`doctor`, `get`, `info`);
// the transport is protobuf over gRPC.
//
// Every comment states what a caller may rely on, never how the server
// produces it. From 1.0.0, field numbers are never reused (Stability in
// CONTRIBUTING.md).
syntax = "proto3";

package icetray.v1;

// Lookups in the tables the server is configured to serve. A request for a
// table the server does not serve is a NOT_FOUND error. A request is an
// INVALID_ARGUMENT error when it omits the key or sets no variant in it,
// sets a variant that does not match the table's key type, lists a value
// column the table does not serve or lists one twice, or lists fields of a
// column in a way ColumnRead does not allow. A key that is not in the table
// is a successful response, never an error. A request that lists fields of
// a value that is not the protobuf its column declares is a
// FAILED_PRECONDITION error, the same on every attempt until the table's
// data changes, so a caller does not retry it.
service Icetray {
  // Look up one key in one table. The response carries the id of the
  // snapshot the server read it from.
  rpc Get(GetRequest) returns (GetResponse);
  // Look up many keys in one table. The response returns the results in
  // request order, all read from one snapshot. When the lookup of any key
  // fails, the whole call fails, so a response always covers every key of
  // the request. A caller that retries resends the whole batch; a
  // FAILED_PRECONDITION error recurs on every retry.
  rpc MultiGet(MultiGetRequest) returns (MultiGetResponse);
  // Read the rows of one key in one ordered table, in order-value order,
  // one page at a time. The response carries the id of the snapshot the
  // server read it from.
  rpc Scan(ScanRequest) returns (ScanResponse);
  // Read the rows of many keys in one ordered table, each as a Scan reads
  // them, all from one snapshot. The response returns one result per key in
  // request order, a key listed twice answered at each position. When the
  // read of any key fails, the whole call fails, so a response always
  // covers every key of the request. A caller that retries resends the
  // whole call; a FAILED_PRECONDITION error recurs on every retry.
  rpc MultiScan(MultiScanRequest) returns (MultiScanResponse);
  // Describe the snapshot the server currently serves for a table.
  rpc TableInfo(TableInfoRequest) returns (TableInfoResponse);
}

// A lookup key. The variant must match the table's key type, which
// TableInfoResponse.key_type reports; a request that sets another variant
// is an INVALID_ARGUMENT error.
message Key {
  // Exactly one variant is set.
  oneof key {
    // The key of a table whose key type is KEY_TYPE_LONG: a signed 64-bit
    // integer.
    int64 long = 1;
    // The key of a table whose key type is KEY_TYPE_STRING: UTF-8 text,
    // matched as its bytes.
    string str = 2;
    // The key of a table whose key type is KEY_TYPE_BINARY or KEY_TYPE_UUID.
    // `bin` carries binary, fixed, and uuid keys, and the table's key type
    // determines how the server reads its bytes: a binary or fixed key is
    // the column's bytes, matched bytewise; a uuid key is the sixteen bytes
    // of the UUID, and a uuid key of any other length is an
    // INVALID_ARGUMENT error. The server matches the bytes unchanged, so the
    // caller encodes a composite key into them.
    bytes bin = 3;
  }
}

// One lookup in one table.
message GetRequest {
  // The name the server is configured to serve the table under. A name the
  // server does not serve is a NOT_FOUND error.
  string table = 1;
  // The key to look up. Its variant must match the table's key type; a
  // request that omits it is an INVALID_ARGUMENT error.
  Key key = 2;
  // The value columns to read, among those TableInfoResponse lists. The
  // response carries one value per column listed, in this order. The
  // server has no default column: an empty list requests the key's
  // presence alone and reads no value. A ColumnRead with no fields reads its
  // column whole. A name the table does not serve, or a name listed twice,
  // is an INVALID_ARGUMENT error.
  repeated ColumnRead columns = 3;
}

// One value column a request reads, whole or projected to some of its
// top-level protobuf fields.
message ColumnRead {
  // The column's name, as TableInfoResponse lists it.
  string name = 1;
  // The top-level field numbers to project the value to, for a column
  // TableInfoResponse lists as VALUE_FORMAT_PROTOBUF. An empty list returns
  // the whole value, unchanged, where an empty GetRequest.columns reads no
  // value. A list for a column of another format, a number outside 1 to
  // 536870911, or a number listed twice is an INVALID_ARGUMENT error. The
  // projected value holds every occurrence of each listed top-level field,
  // each whole and in the value's order, and nothing else, so it parses as
  // the caller's message type whenever the whole value does: each listed
  // field reads as in the whole value and every other field reads as
  // unset. A value holding none of the listed fields is returned as `value`
  // with zero bytes, and a null is returned as `null_value`. The server
  // holds no schema, so two rules are the caller's. A caller that lists a
  // member of a oneof lists every member of it, since a member that a later
  // member of the whole value cleared is otherwise returned set. A caller
  // parses a projected message that has required fields partially (Go's
  // UnmarshalOptions{AllowPartial: true}, Java's parsePartialFrom), since
  // the projected value lacks every field the request does not list. A
  // value that is not protobuf fails the call as FAILED_PRECONDITION,
  // whichever fields are listed. The server accepts a number that is not a
  // field of the caller's type and returns whatever the value carries under
  // it.
  repeated uint32 fields = 2;
}

// Whether a key is in the snapshot. The server returns PRESENCE_PRESENT or
// PRESENCE_ABSENT, distinct on the wire, and each value of a present key
// may separately be null (ColumnValue.null_value).
enum Presence {
  // Never sent by the server. It is the proto3 default, so a field that
  // reads as unspecified was not set by a server response.
  PRESENCE_UNSPECIFIED = 0;
  // The key is in the snapshot; `values` carries one value per requested
  // column.
  PRESENCE_PRESENT = 1;
  // The key is not in the snapshot; `values` is empty. A miss is a
  // successful response.
  PRESENCE_ABSENT = 2;
}

// An empty marker: the value is null.
message NullValue {}

// One column's value for a present key. Exactly one variant is set. A null
// value is `null_value`; a value of zero length is `value` holding no
// bytes; the two are distinct. The table's owner defines what a null value
// means.
message ColumnValue {
  // Exactly one variant is set.
  oneof kind {
    // The value's bytes, unchanged from the table: a binary or fixed
    // column's bytes, a string column's UTF-8; or, for a request that
    // listed fields, the value projected to them as ColumnRead.fields
    // describes.
    bytes value = 1;
    // The value is null.
    NullValue null_value = 2;
  }
}

// The response to one Get.
message GetResponse {
  // Whether the key is in the snapshot.
  Presence presence = 1;
  // When presence is PRESENCE_PRESENT, one value per column the request
  // listed, in the request's order: values[i] is the value of columns[i].
  // Empty otherwise, and empty for a request that listed no column.
  repeated ColumnValue values = 2;
  // The id of the Iceberg snapshot the server read the response from. Two
  // responses carrying different ids were read from different snapshots of
  // the table.
  int64 snapshot_id = 3;
}

// Several lookups in one table, all read from one snapshot.
message MultiGetRequest {
  // The name the server is configured to serve the table under. A name the
  // server does not serve is a NOT_FOUND error.
  string table = 1;
  // The keys to look up. Every variant must match the table's key type.
  // The response carries one result per key, in this order.
  repeated Key keys = 2;
  // The value columns to read for every key, as GetRequest.columns reads
  // them: one list for the whole call, with each column's fields applied
  // to every key. An empty list returns presence alone, a ColumnRead with
  // no fields reads its column whole, and a name the table does not serve
  // or a name listed twice is an INVALID_ARGUMENT error. A call that
  // requests more values than the server's limit is an INVALID_ARGUMENT
  // error before the server looks up any key; the count is its keys times
  // its columns, a presence-only call counting one per key, whatever fields
  // each column lists. When a ColumnRead lists fields, a value of any key
  // that is not the protobuf its column declares fails the whole call as
  // FAILED_PRECONDITION.
  repeated ColumnRead columns = 3;
}

// The result for one key of a MultiGet. Its snapshot is the one
// MultiGetResponse.snapshot_id names, which the server read every result
// of the batch from.
message Hit {
  // Whether the key is in the snapshot.
  Presence presence = 1;
  // When presence is PRESENCE_PRESENT, one value per column the request
  // listed, in the request's order; empty otherwise.
  repeated ColumnValue values = 2;
}

// The response to a MultiGet. The call fails as a whole when the lookup of
// any key fails, so a response covers every key of the request.
message MultiGetResponse {
  // One result per requested key, in request order: results[i] is the
  // result for keys[i].
  repeated Hit results = 1;
  // The id of the Iceberg snapshot the server read every result from, so
  // the results of a batch are consistent with each other.
  int64 snapshot_id = 2;
}

// The Iceberg type of an ordered table's order column. It determines which
// OrderValue variant a bound sets and how order values compare: the integer,
// date, and timestamp types as numbers, and the string, binary, and fixed
// types as their bytes. Clients switch on it.
enum OrderType {
  // The proto3 default. TableInfoResponse carries it for a table with no
  // order column; no ordered table has it.
  ORDER_TYPE_UNSPECIFIED = 0;
  // Iceberg `int`. Bounds and order values are OrderValue.long.
  ORDER_TYPE_INT = 1;
  // Iceberg `long`. Bounds and order values are OrderValue.long.
  ORDER_TYPE_LONG = 2;
  // Iceberg `date`: days since the epoch, as OrderValue.long.
  ORDER_TYPE_DATE = 3;
  // Iceberg `timestamp`: microseconds, as OrderValue.long.
  ORDER_TYPE_TIMESTAMP = 4;
  // Iceberg `timestamptz`: microseconds since the epoch, as
  // OrderValue.long.
  ORDER_TYPE_TIMESTAMPTZ = 5;
  // Iceberg `timestamp_ns`: nanoseconds, as OrderValue.long.
  ORDER_TYPE_TIMESTAMP_NS = 6;
  // Iceberg `timestamptz_ns`: nanoseconds since the epoch, as
  // OrderValue.long.
  ORDER_TYPE_TIMESTAMPTZ_NS = 7;
  // Iceberg `string`. Bounds and order values are OrderValue.str, compared
  // as their UTF-8 bytes.
  ORDER_TYPE_STRING = 8;
  // Iceberg `binary`. Bounds and order values are OrderValue.bin, compared
  // bytewise.
  ORDER_TYPE_BINARY = 9;
  // Iceberg `fixed`: every value is `TableInfoResponse.order_width` bytes.
  // Bounds and order values are OrderValue.bin, compared bytewise.
  ORDER_TYPE_FIXED = 10;
}

// The value of an ordered table's order column: a bound of a Scan, or the
// position of a returned row. The variant must match the order type, which
// TableInfoResponse.order_type reports: `long` for the integer, date, and
// timestamp types, `str` for ORDER_TYPE_STRING, and `bin` for
// ORDER_TYPE_BINARY and ORDER_TYPE_FIXED. A bound that sets no variant or
// another one is an INVALID_ARGUMENT error. A bound outside an `int` or
// `date` column's range is valid: it admits every row on its side.
message OrderValue {
  // Exactly one variant is set.
  oneof value {
    // An order value of an integer, date, or timestamp type, a signed
    // 64-bit integer in the type's unit (days, microseconds, or
    // nanoseconds).
    int64 long = 1;
    // An order value of ORDER_TYPE_STRING: UTF-8 text, compared as its
    // bytes.
    string str = 2;
    // An order value of ORDER_TYPE_BINARY or ORDER_TYPE_FIXED, compared
    // bytewise.
    bytes bin = 3;
  }
}

// The direction a Scan reads a key's rows in.
enum Direction {
  // Never sent by the server. A request that sets it is an
  // INVALID_ARGUMENT error: the server has no default direction.
  DIRECTION_UNSPECIFIED = 0;
  // The highest order value first.
  DIRECTION_NEWEST_FIRST = 1;
  // The lowest order value first.
  DIRECTION_OLDEST_FIRST = 2;
}

// One Scan of one key in one ordered table. A request is an
// INVALID_ARGUMENT error when it omits the key or sets no variant in it,
// sets a variant that does not match the table's key type, lists a value
// column the table does not serve or lists one twice, lists fields of a
// column in a way ColumnRead does not allow, sets no direction, sets a
// limit above TableInfoResponse.max_scan_rows, sets a bound of another
// variant than the table's order type takes or one with no variant, sets
// `after` at or above `before`, or names a table that has no order column.
message ScanRequest {
  // The name the server is configured to serve the table under. A name the
  // server does not serve is a NOT_FOUND error.
  string table = 1;
  // The key whose rows to read. Its variant must match the table's key
  // type; a request that omits it is an INVALID_ARGUMENT error.
  Key key = 2;
  // The value columns to read for each row, as GetRequest.columns reads
  // them: the response carries one value per column listed, in this order,
  // for every row. An empty list reads the order values alone, and a
  // ColumnRead with no fields reads its column whole.
  repeated ColumnRead columns = 3;
  // The direction the rows are returned in. It must be set.
  Direction direction = 4;
  // The most rows to return. 0 reads up to TableInfoResponse.max_scan_rows;
  // a limit above it is an INVALID_ARGUMENT error.
  uint32 limit = 5;
  // When set, only rows whose order value is above this one, exclusive. A
  // caller reading oldest first pages by setting it to the newest order
  // value of the previous response.
  OrderValue after = 6;
  // When set, only rows whose order value is below this one, exclusive. A
  // caller reading newest first pages by setting it to the oldest order
  // value of the previous response. When both bounds are set, `after` must
  // be below `before`.
  OrderValue before = 7;
}

// One row of a Scan.
message ScanRow {
  // The row's order value, in the variant the table's order type takes.
  OrderValue order = 1;
  // One value per column the request listed, in the request's order:
  // values[i] is the value of columns[i], as GetResponse.values reads.
  // Empty for a request that listed no column.
  repeated ColumnValue values = 2;
}

// The response to one Scan.
message ScanResponse {
  // The key's rows within the bounds, in the requested direction and no
  // more than the limit. Empty for a key with no rows, which is a
  // successful response, never an error. No two rows of one response
  // share an order value.
  repeated ScanRow rows = 1;
  // Whether the key has rows within the bounds past the last one returned,
  // in the requested direction. Unset for a key with no rows.
  bool more = 2;
  // The id of the Iceberg snapshot the server read the response from. Two
  // responses carrying different ids were read from different snapshots of
  // the table, and a page read after the table advanced is read from the
  // newer one.
  int64 snapshot_id = 3;
}

// Several Scans in one ordered table with one set of columns, direction,
// limit, and bounds, all read from one snapshot. The request is an
// INVALID_ARGUMENT error for every reason a ScanRequest is, for a key of
// any position, and when its keys times its limit times one more than its
// columns exceed the server's limit, a limit of 0 counting as
// TableInfoResponse.max_scan_rows; the server refuses that before it reads
// any key.
message MultiScanRequest {
  // The name the server is configured to serve the table under. A name the
  // server does not serve is a NOT_FOUND error.
  string table = 1;
  // The keys whose rows to read. Every variant must match the table's key
  // type. The response carries one result per key, in this order, and a
  // key listed twice is answered at each position.
  repeated Key keys = 2;
  // The value columns to read for every row of every key, as
  // ScanRequest.columns reads them.
  repeated ColumnRead columns = 3;
  // The direction every key's rows are returned in. It must be set.
  Direction direction = 4;
  // The most rows to return per key, as ScanRequest.limit.
  uint32 limit = 5;
  // The exclusive lower bound on every key's rows, as ScanRequest.after.
  OrderValue after = 6;
  // The exclusive upper bound on every key's rows, as ScanRequest.before.
  OrderValue before = 7;
}

// The result for one key of a MultiScan: what a Scan of the key answers,
// without a snapshot id of its own.
message ScanResult {
  // The key's rows, as ScanResponse.rows.
  repeated ScanRow rows = 1;
  // Whether the key has rows past the last one returned, as
  // ScanResponse.more.
  bool more = 2;
}

// The response to a MultiScan. The call fails as a whole when the read of
// any key fails, so a response covers every key of the request.
message MultiScanResponse {
  // One result per requested key, in request order: results[i] is the
  // result for keys[i].
  repeated ScanResult results = 1;
  // The id of the Iceberg snapshot the server read every result from, so
  // the results of a call are consistent with each other.
  int64 snapshot_id = 2;
}

// A request to describe the snapshot the server serves for one table.
message TableInfoRequest {
  // The name the server is configured to serve the table under. A name the
  // server does not serve is a NOT_FOUND error.
  string table = 1;
}

// The Iceberg type of a table's key column. It determines which Key
// variant a request sets and how the server reads a `bin` key's bytes;
// clients switch on it.
enum KeyType {
  // Never sent by the server. It is the proto3 default, so a field that
  // reads as unspecified was not set by a server response.
  KEY_TYPE_UNSPECIFIED = 0;
  // Iceberg `long`. Requests set Key.long.
  KEY_TYPE_LONG = 1;
  // Iceberg `string`. Requests set Key.str.
  KEY_TYPE_STRING = 2;
  // Iceberg `binary` or `fixed`. Requests set Key.bin to the key's bytes.
  KEY_TYPE_BINARY = 3;
  // Iceberg `uuid`. Requests set Key.bin to the sixteen bytes of the UUID.
  KEY_TYPE_UUID = 4;
}

// The Iceberg type of a value column. Every type is served as its bytes
// unchanged: a string as its UTF-8.
enum ValueType {
  // Never sent by the server. It is the proto3 default, so a field that
  // reads as unspecified was not set by a server response.
  VALUE_TYPE_UNSPECIFIED = 0;
  // Iceberg `binary`.
  VALUE_TYPE_BINARY = 1;
  // Iceberg `fixed`: every value is `ValueColumn.width` bytes.
  VALUE_TYPE_FIXED = 2;
  // Iceberg `string`.
  VALUE_TYPE_STRING = 3;
}

// The format of a value column's values, as the table's configuration
// declares it.
enum ValueFormat {
  // Never sent by the server. It is the proto3 default, so a field that
  // reads as unspecified was not set by a server response.
  VALUE_FORMAT_UNSPECIFIED = 0;
  // Bytes the server returns as stored; a request reads the whole value.
  VALUE_FORMAT_OPAQUE = 1;
  // A serialized protobuf message, of a VALUE_TYPE_BINARY column; a request
  // may project it to some of its top-level fields (ColumnRead.fields).
  VALUE_FORMAT_PROTOBUF = 2;
}

// One value column the table serves, which a request may list.
message ValueColumn {
  // The name a request lists the column by.
  string name = 1;
  // The column's type.
  ValueType value_type = 2;
  // The bytes of every value of a VALUE_TYPE_FIXED column; 0 for every
  // other type.
  uint32 width = 3;
  // The column's format. It can change while the snapshot stays the same,
  // and the server checks a request that lists fields against the format
  // current when the request arrives.
  ValueFormat format = 4;
}

// The snapshot the server currently serves for a table.
message TableInfoResponse {
  // The name the table was requested under.
  string table = 1;
  // The Iceberg snapshot id being served. Get, MultiGet, Scan, and
  // MultiScan responses for the table carry this id until the table
  // advances to another snapshot.
  int64 snapshot_id = 2;
  // The bucket count of the key column's bucket partition; 0 when the
  // table is not bucket-partitioned.
  uint32 buckets = 3;
  // The number of data files in the served snapshot.
  uint64 data_files = 4;
  // The number of rows in the served snapshot.
  uint64 records = 5;
  // The key column's type. It determines which Key variant a request must
  // set and how the server reads a `bin` key's bytes.
  KeyType key_type = 6;
  // The bytes resident in memory for this table's lookup index, as one
  // total with no breakdown.
  uint64 index_bytes = 7;
  // The value columns a request may list, in name order, names compared as
  // their UTF-8 bytes; empty for a table that serves only key presence.
  repeated ValueColumn value_columns = 8;
  // The name of the order column of an ordered table, whose rows Scan and
  // MultiScan read; empty for a table with no order column, which Get and
  // MultiGet serve.
  string order_column = 9;
  // The order column's type. It determines which OrderValue variant a
  // bound sets. ORDER_TYPE_UNSPECIFIED for a table with no order column.
  OrderType order_type = 10;
  // The bytes of every order value of an ORDER_TYPE_FIXED column; 0 for
  // every other type.
  uint32 order_width = 11;
  // The most rows one Scan may ask for, and what a limit of 0 reads; 0
  // for a table with no order column.
  uint32 max_scan_rows = 12;
}

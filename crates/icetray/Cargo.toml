[package]
name = "icetray"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One binary: the serve daemon and the one-shot doctor, get, and info subcommands"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
icetray-core = { workspace = true }
icetray-proto = { workspace = true }
memory-stats = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
tikv-jemallocator = { workspace = true }
# `net` for the two listeners, `signal` for the SIGTERM drain (RFD 012)
# and the SIGHUP reload (RFD 018).
tokio = { workspace = true, features = ["net", "signal"] }
tonic = { workspace = true }
tonic-health = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
icetray-testkit = { workspace = true }
tempfile = { workspace = true }

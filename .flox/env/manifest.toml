# The development environment: `flox activate` and everything the build needs
# is on PATH. `rust-toolchain.toml` is the toolchain contract, so a plain
# rustup install works too and CI uses one.

schema-version = "1.10.0"

[install]
# rustup rather than a compiler: rust-toolchain.toml names the version, and
# pinning it here as well would give two sources of truth.
rustup.pkg-path = "rustup"
# Only the container-gated catalog test needs these; dev/runtime.sh drives them.
colima.pkg-path = "colima"
docker-client.pkg-path = "docker-client"
docker-compose.pkg-path = "docker-compose"
# The performance sweep: samply profiles the benchmark program
# (crates/icetray-testkit/examples), ghz drives the gRPC server under load.
samply.pkg-path = "samply"
ghz.pkg-path = "ghz"

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]

[hook]
on-activate = '''
  # Toolchains per checkout; the crates.io cache stays shared at CARGO_HOME's
  # default, or every checkout re-downloads every dependency.
  export RUSTUP_HOME="${RUSTUP_HOME:-$FLOX_ENV_CACHE/rustup}"
  # colima start fails on a missing config directory rather than creating one.
  export DOCKER_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}"
'''
